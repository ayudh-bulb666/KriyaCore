# Nginx reverse proxy for KriyaCore.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kriyacore
#   sudo ln -s /etc/nginx/sites-available/kriyacore /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot to add HTTPS (it edits this file automatically):
#   sudo certbot --nginx -d kriyacore.in -d www.kriyacore.in
#
# Both names are listed so the certificate covers www too. Point BOTH an A
# record for @ and a CNAME (or A) for www at the VPS before running certbot —
# it validates by fetching over HTTP, so a name that doesn't resolve makes
# the whole command fail, not just that one name.

server {
    listen 80;
    server_name kriyacore.in www.kriyacore.in;

    client_max_body_size 10M;   # room for logo uploads (base64 in the DB)

    # Don't advertise the nginx version. Minor on its own, but it's free and
    # it stops the server appearing in scans keyed to a specific version.
    # The app's own Server header (gunicorn) is stripped below.
    server_tokens off;
    proxy_hide_header Server;

    # The security headers themselves are set by the app (see
    # security_headers() in app/__init__.py) so they hold on any host, not
    # only behind this nginx.

    location /static/ {
        alias /home/deploy/kriyacore/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
