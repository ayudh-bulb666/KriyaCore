# Nginx reverse proxy for GYMPro.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gympro
#   sudo ln -s /etc/nginx/sites-available/gympro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot to add HTTPS (it edits this file automatically):
#   sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 10M;   # room for logo uploads (base64 in the DB)

    location /static/ {
        alias /home/deploy/gympro/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
