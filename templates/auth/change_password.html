{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block heading %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md">
  <div class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm overflow-hidden">

    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-100 dark:border-slate-700">
      <div class="w-10 h-10 rounded-xl bg-brand flex items-center justify-center text-white shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <div>
        <h2 class="type-h3 text-gray-900 dark:text-white">Change your password</h2>
        <p class="type-p3 text-gray-400 dark:text-slate-500 mt-0.5">Signed in as {{ current_user.email }}</p>
      </div>
    </div>

    <form method="POST" action="{{ url_for('auth.change_password') }}"
          x-data="{ showCurrent: false, showNew: false, showConfirm: false, strength: 0, match: true }"
          class="px-6 py-5 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Current password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-slate-300 mb-1.5">
          Current password
        </label>
        <div class="relative">
          <input :type="showCurrent ? 'text' : 'password'"
                 name="current_password" required autocomplete="current-password"
                 class="w-full px-4 py-2.5 pr-11 text-sm border border-gray-200 dark:border-slate-600 rounded-xl
                        bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100
                        focus:outline-none focus:ring-2 focus:ring-brand">
          <button type="button" @click="showCurrent = !showCurrent"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-300">
            <svg x-show="!showCurrent" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg x-show="showCurrent" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- New password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-slate-300 mb-1.5">
          New password
          <span class="text-xs font-normal text-gray-400 dark:text-slate-500 ml-1">(min. 8 characters)</span>
        </label>
        <div class="relative">
          <input :type="showNew ? 'text' : 'password'"
                 name="new_password" required autocomplete="new-password"
                 x-on:input="
                   let v = $event.target.value;
                   strength = 0;
                   if (v.length >= 8) strength++;
                   if (/[A-Z]/.test(v)) strength++;
                   if (/[0-9]/.test(v)) strength++;
                   if (/[^A-Za-z0-9]/.test(v)) strength++;
                 "
                 class="w-full px-4 py-2.5 pr-11 text-sm border border-gray-200 dark:border-slate-600 rounded-xl
                        bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100
                        focus:outline-none focus:ring-2 focus:ring-brand">
          <button type="button" @click="showNew = !showNew"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-300">
            <svg x-show="!showNew" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg x-show="showNew" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
        <!-- Strength bar -->
        <div class="flex gap-1 mt-2" x-show="strength > 0" x-cloak>
          <div class="h-1 flex-1 rounded-full transition-colors"
               :style="strength >= 1 ? 'background:#ef4444' : 'background:#e5e7eb'"></div>
          <div class="h-1 flex-1 rounded-full transition-colors"
               :style="strength >= 2 ? 'background:#f97316' : 'background:#e5e7eb'"></div>
          <div class="h-1 flex-1 rounded-full transition-colors"
               :style="strength >= 3 ? 'background:#eab308' : 'background:#e5e7eb'"></div>
          <div class="h-1 flex-1 rounded-full transition-colors"
               :style="strength >= 4 ? 'background:#22c55e' : 'background:#e5e7eb'"></div>
        </div>
        <p class="text-xs mt-1 transition-colors"
           x-show="strength > 0" x-cloak
           :style="strength === 1 ? 'color:#ef4444' : strength === 2 ? 'color:#f97316' : strength === 3 ? 'color:#eab308' : 'color:#22c55e'">
          <span x-text="['', 'Weak', 'Fair', 'Good', 'Strong'][strength]"></span>
        </p>
      </div>

      <!-- Confirm password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-slate-300 mb-1.5">
          Confirm new password
        </label>
        <div class="relative">
          <input :type="showConfirm ? 'text' : 'password'"
                 name="confirm_password" required autocomplete="new-password"
                 x-on:input="
                   let pw = $el.closest('form').querySelector('[name=new_password]').value;
                   match = $event.target.value === pw || $event.target.value === '';
                 "
                 class="w-full px-4 py-2.5 pr-11 text-sm border rounded-xl
                        bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100
                        focus:outline-none focus:ring-2 focus:ring-brand transition-colors"
                 :class="match ? 'border-gray-200 dark:border-slate-600' : 'border-red-400 dark:border-red-500'">
          <button type="button" @click="showConfirm = !showConfirm"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-300">
            <svg x-show="!showConfirm" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg x-show="showConfirm" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
        <p x-show="!match" x-cloak class="text-xs text-red-500 dark:text-red-400 mt-1">Passwords don't match</p>
      </div>

      <div class="flex items-center justify-between pt-2">
        <a href="{{ url_for('dashboard.index') if not current_user.is_platform_admin else url_for('operator.index') }}"
           class="type-p2 text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200 transition-colors">
          Cancel
        </a>
        <button type="submit"
                class="inline-flex items-center gap-2 px-5 py-2.5 btn-brand text-sm font-semibold rounded-xl transition-colors shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Update Password
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
