{% extends 'base.html' %}
{% block title %}Assign Membership{% endblock %}
{% block heading %}Assign Membership{% endblock %}

{% block content %}
<div class="max-w-lg" x-data="{ selectedPlan: null, plans: {{ plans | tojson }} }">
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 p-6">
    <form method="POST" action="{{ url_for('billing.new') }}" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5" for="member_id">Member <span class="text-red-500">*</span></label>
        <select id="member_id" name="member_id" required
                class="w-full px-3.5 py-2.5 border border-gray-200 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="">— Select a member —</option>
          {% for member in members %}
          <option value="{{ member.id }}" {% if request.args.get('member_id') == member.id|string %}selected{% endif %}>
            {{ member.full_name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Plan <span class="text-red-500">*</span></label>
        <div class="space-y-2">
          {% for plan in plans %}
          <label class="flex items-center gap-4 p-3.5 border border-gray-200 dark:border-slate-600 rounded-lg cursor-pointer hover:border-green-300 dark:hover:border-green-500 hover:bg-green-50/50 dark:hover:bg-green-900/20 transition-colors has-[:checked]:border-green-600 has-[:checked]:bg-green-50 dark:has-[:checked]:bg-green-900/30">
            <input type="radio" name="plan_id" value="{{ plan.id }}" required
                   @change="selectedPlan = {{ plan.id }}"
                   class="accent-green-700" />
            <div class="flex-1">
              <p class="font-medium text-gray-800 dark:text-slate-200">{{ plan.name }}</p>
              <p class="text-xs text-gray-500 dark:text-slate-400">{{ plan.duration_days }} days</p>
            </div>
            <span class="font-bold text-gray-900 dark:text-slate-100">₹{{ "%.2f"|format(plan.price) }}</span>
          </label>
          {% endfor %}
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5" for="start_date">Start Date <span class="text-red-500">*</span></label>
        <input id="start_date" name="start_date" type="date" required value="{{ today }}"
               class="w-full px-3.5 py-2.5 border border-gray-200 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Payment Status</label>
        <div class="flex gap-3">
          <label class="flex-1 flex items-center gap-2 p-3 border border-gray-200 dark:border-slate-600 rounded-lg cursor-pointer hover:border-green-300 dark:hover:border-green-500 transition-colors has-[:checked]:border-green-600 has-[:checked]:bg-green-50 dark:has-[:checked]:bg-green-900/30">
            <input type="radio" name="payment_status" value="pending" checked class="accent-green-700" />
            <span class="text-sm text-gray-700 dark:text-slate-300">Pending</span>
          </label>
          <label class="flex-1 flex items-center gap-2 p-3 border border-gray-200 dark:border-slate-600 rounded-lg cursor-pointer hover:border-green-300 dark:hover:border-green-600 transition-colors has-[:checked]:border-green-500 has-[:checked]:bg-green-50 dark:has-[:checked]:bg-green-900/30">
            <input type="radio" name="payment_status" value="paid" class="accent-green-600" />
            <span class="text-sm text-gray-700 dark:text-slate-300">Paid</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Notes</label>
        <textarea name="notes" rows="2"
                  class="w-full px-3.5 py-2.5 border border-gray-200 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none"
                  placeholder="Optional notes…"></textarea>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="px-5 py-2.5 bg-green-700 hover:bg-green-600 text-white text-sm font-medium rounded-lg transition-colors shadow">
          Assign Membership
        </button>
        <a href="{{ url_for('billing.index') }}"
           class="px-5 py-2.5 text-sm text-gray-600 dark:text-slate-400 hover:text-gray-800 dark:hover:text-slate-200 rounded-lg border border-gray-200 dark:border-slate-600 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors">
          Cancel
        </a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
