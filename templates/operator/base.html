<!DOCTYPE html>
<html lang="en" class="h-full"
      x-data="{ darkMode: localStorage.getItem('gympro-dark') === 'true' }"
      :class="{ dark: darkMode }"
      x-init="$watch('darkMode', v => localStorage.setItem('gympro-dark', v))">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Operator{% endblock %} — GYMPro Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script>if (localStorage.getItem('gympro-dark') === 'true') document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } }</script>
  <style>
    [x-cloak] { display: none !important; }

    /* ── Typography scale (same as gym-side base.html) ───────────────── */
    .type-h1    { font-size:1.375rem;  line-height:1.875rem;  font-weight:700; letter-spacing:-0.015em; }
    .type-h2    { font-size:1.0625rem; line-height:1.5rem;    font-weight:700; letter-spacing:-0.008em; }
    .type-h3    { font-size:0.9375rem; line-height:1.375rem;  font-weight:600; }
    .type-h4    { font-size:0.6875rem; line-height:1rem;      font-weight:600; letter-spacing:0.07em; text-transform:uppercase; }
    .type-p1    { font-size:0.9375rem; line-height:1.5rem;    font-weight:400; }
    .type-p2    { font-size:0.875rem;  line-height:1.375rem;  font-weight:400; }
    .type-p3    { font-size:0.75rem;   line-height:1.125rem;  font-weight:400; }
    .type-display { font-size:2.25rem; line-height:2.75rem;   font-weight:700; letter-spacing:-0.025em; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body class="h-full bg-gray-50 dark:bg-slate-950 transition-colors">

<!-- Top nav -->
<header class="bg-green-900 text-white px-6 py-3.5 flex items-center gap-4 shadow-md">
  <div class="flex items-center gap-2.5">
    <div class="w-7 h-7 bg-white/20 rounded-lg flex items-center justify-center">
      <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29l-1.43-1.43z"/>
      </svg>
    </div>
    <span class="font-bold text-base tracking-tight">GYMPro</span>
    <span class="text-green-300 text-xs font-semibold px-2 py-0.5 bg-white/10 rounded-full ml-1">Platform Admin</span>
  </div>

  <nav class="flex items-center gap-1 ml-6">
    <a href="{{ url_for('operator.index') }}"
       class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors
              {% if request.endpoint == 'operator.index' %}bg-white/20 text-white{% else %}text-green-200 hover:text-white hover:bg-white/10{% endif %}">
      All Gyms
    </a>
    <a href="{{ url_for('operator.new_gym') }}"
       class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors
              {% if request.endpoint == 'operator.new_gym' %}bg-white/20 text-white{% else %}text-green-200 hover:text-white hover:bg-white/10{% endif %}">
      + New Gym
    </a>
    <a href="{{ url_for('operator.audit_log') }}"
       class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors
              {% if request.endpoint == 'operator.audit_log' %}bg-white/20 text-white{% else %}text-green-200 hover:text-white hover:bg-white/10{% endif %}">
      Audit Log
    </a>
    <a href="{{ url_for('operator.broadcast') }}"
       class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors
              {% if request.endpoint == 'operator.broadcast' %}bg-white/20 text-white{% else %}text-green-200 hover:text-white hover:bg-white/10{% endif %}">
      📢 Broadcast
    </a>
  </nav>

  <div class="ml-auto flex items-center gap-3">
    <!-- Dark mode toggle -->
    <button @click="darkMode = !darkMode"
            class="p-1.5 rounded-lg text-green-200 hover:text-white hover:bg-white/10 transition-colors">
      <svg x-show="!darkMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
      <svg x-show="darkMode" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
    </button>
    <div class="text-sm text-green-200">{{ current_user.name }}</div>
    <a href="{{ url_for('auth.change_password') }}"
       class="text-xs text-green-300 hover:text-white transition-colors px-2 py-1 rounded hover:bg-white/10">
      Change password
    </a>
    <a href="{{ url_for('auth.logout') }}"
       class="text-xs text-green-300 hover:text-white transition-colors px-2 py-1 rounded hover:bg-white/10">
      Sign out
    </a>
  </div>
</header>

<!-- Flash messages -->
<div class="max-w-7xl mx-auto px-6 pt-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
  <div class="mb-3 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2
    {% if category == 'success' %}bg-green-50 text-green-800 border border-green-200 dark:bg-green-900/30 dark:text-green-300 dark:border-green-800
    {% elif category == 'danger' %}bg-red-50 text-red-800 border border-red-200 dark:bg-red-900/30 dark:text-red-300 dark:border-red-800
    {% else %}bg-blue-50 text-blue-800 border border-blue-200 dark:bg-blue-900/30 dark:text-blue-300 dark:border-blue-800{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
  {% endwith %}
</div>

<!-- Content -->
<main class="max-w-7xl mx-auto px-6 py-6">
  {% block content %}{% endblock %}
</main>

</body>
</html>
