{% extends 'base.html' %}
{% block title %}Add Staff{% endblock %}
{% block heading %}Add Staff Member{% endblock %}

{% block content %}
<div class="max-w-md">
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 p-6">
    <form method="POST" action="{{ url_for('staff.new') }}" class="space-y-5">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5" for="name">Full Name <span class="text-red-500">*</span></label>
        <input id="name" name="name" type="text" required
               class="w-full px-3.5 py-2.5 border border-gray-200 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus-brand"
               placeholder="John Carter" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5" for="email">Email <span class="text-red-500">*</span></label>
        <input id="email" name="email" type="email" required
               class="w-full px-3.5 py-2.5 border border-gray-200 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus-brand"
               placeholder="john@gympro.com" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5" for="password">Password <span class="text-red-500">*</span></label>
        <input id="password" name="password" type="password" required minlength="6"
               class="w-full px-3.5 py-2.5 border border-gray-200 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus-brand"
               placeholder="Min. 6 characters" />
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="px-5 py-2.5 btn-brand text-sm font-medium rounded-lg transition-colors shadow">
          Add Staff Member
        </button>
        <a href="{{ url_for('staff.index') }}"
           class="px-5 py-2.5 type-p2 text-gray-600 dark:text-slate-400 hover:text-gray-800 dark:hover:text-slate-200 rounded-lg border border-gray-200 dark:border-slate-600 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors">
          Cancel
        </a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
